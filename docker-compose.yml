services:
  chess-scoresheet-digitalization:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/chess-scoresheet-digitalization:${DOCKER_IMAGE_VERSION}
    ports:
      - "8000:8000"
  hcs-model:
    image: ${DOCKER_USERNAME}/${MODEL_NAME}:${MODEL_VERSION}
    ports:
      - "1000:8080"